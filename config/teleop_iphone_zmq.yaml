teleop_iphone_zmq:
  ros__parameters:
    # ZMQ connection settings
    zmq_ip: "127.0.0.1"
    zmq_port: 5555

    # iPhone TF frames
    iphone_source_frame: "iphone_odom"
    iphone_target_frame: "iphone_ros"

    # Arm TF frames
    arm_base_frame: "base_link"
    arm_ee_frame: "link6"

    # Touch radius threshold to detect pressing
    touch_threshold: 0.3
    touch_timeout: 0.05

    # Scale factor for position mapping (iphone movement -> EE movement)
    position_scale: 1.0
    rotation_scale: 0.5

    # Gripper positions
    gripper_open: 0.08
    gripper_close: 0.0

    # Update rates
    tf_update_rate: 100.0  # Hz
    control_rate: 50       # Hz
