teleop_iphone:
  ros__parameters:
    # iPhone TF frames
    iphone_source_frame: "iphone_odom"
    iphone_target_frame: "iphone_ros"
    # Arm TF frames
    arm_base_frame: "base_link"
    arm_ee_frame: "eef_link"

    eef_cmd_topic: "/arx5_controller/eef_cmd"
    gripper_cmd_topic: "/arx5_controller/gripper_cmd"
    reset_service_name: "/arx5_controller/reset_to_home"

    # Touch radius threshold to detect pressing
    touch_threshold: 0.3
    touch_timeout: 0.05

    # Scale factor for position mapping (iphone movement -> EE movement)
    position_scale: 1.0
    rotation_scale: 0.5

    # Gripper opening width in meters (clamped to [0, gripper_width] by arx5_ros2)
    gripper_open: 0.08
    gripper_close: 0.0

    control_rate: 60 # hz
